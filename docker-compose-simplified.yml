services:
  redis:
    image: redis:7.2-alpine
    container_name: localllm-redis
    # Not published to the host. Redis holds API keys, cache and rate-limit
    # state and is reachable only on the internal compose network.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"]
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  localllm:
    build:
      context: .
      dockerfile: Dockerfile.simplified
    container_name: localllm-enhanced
    ports:
      - "8080:8080"  # Main API (user-facing)
    expose:
      - "8081"       # Monitoring (internal only)
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - MONITORING_PORT=8081
      - VECTOR_DB_URL=http://vector-db:8007
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3001}
    depends_on:
      redis:
        condition: service_healthy
      vector-db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1536M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: localllm-ui
    ports:
      - "3001:3000"
    depends_on:
      localllm:
        condition: service_healthy
      orchestration:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://localhost:8080
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  orchestration:
    build:
      context: ./orchestration-service
      dockerfile: Dockerfile
    container_name: localllm-orchestration
    expose:
      - "8003"       # Internal only; auth via INTERNAL_API_KEY
    depends_on:
      localllm:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - MULTIMODAL_SERVICE_URL=http://multimodal-agent:8002
      - LANGCHAIN_SERVICE_URL=http://langchain-agent:8000
      - LOCALLLM_SERVICE_URL=http://localllm:8080
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  multimodal-agent:
    build:
      context: ./multimodal-agent
      dockerfile: Dockerfile
    container_name: localllm-multimodal
    expose:
      - "8002"       # Internal only (service-to-service)
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - MULTIMODAL_MODEL=qwen3:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  langchain-agent:
    build:
      context: ./langchain-agent
      dockerfile: Dockerfile
    container_name: localllm-langchain
    expose:
      - "8000"       # Internal only (service-to-service)
    depends_on:
      redis:
        condition: service_healthy
      model-manager:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - MODEL_NAME=qwen3-coder:latest
      - LATEST_CODER_MODEL=qwen3-coder:latest
      - MODEL_MANAGER_URL=http://model-manager:8005
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  model-manager:
    build:
      context: ./model-manager
      dockerfile: Dockerfile
    container_name: localllm-model-manager
    expose:
      - "8005"       # Internal only (service-to-service)
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  meta-orchestrator:
    build:
      context: ./meta-orchestrator
      dockerfile: Dockerfile
    container_name: localllm-meta-orchestrator
    ports:
      - "8004:8004"  # User-facing orchestrator API (auth required)
    depends_on:
      orchestration:
        condition: service_healthy
      multimodal-agent:
        condition: service_healthy
      langchain-agent:
        condition: service_healthy
      localllm:
        condition: service_healthy
      redis:
        condition: service_healthy
      model-manager:
        condition: service_healthy
      web-search:
        condition: service_healthy
      model-improvement:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - LOCALLLM_API_KEY=${LOCALLLM_API_KEY}
      - ORCHESTRATION_URL=http://orchestration:8003
      - MULTIMODAL_URL=http://multimodal-agent:8002
      - LANGCHAIN_URL=http://langchain-agent:8000
      - LOCALLLM_URL=http://localllm:8080
      - MODEL_MANAGER_URL=http://model-manager:8005
      - WEB_SEARCH_URL=http://web-search:8006
      - MODEL_IMPROVEMENT_URL=http://model-improvement:8008
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web-search:
    build:
      context: ./web-search-service
      dockerfile: Dockerfile
    container_name: localllm-web-search
    expose:
      - "8006"       # Internal only (service-to-service)
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  vector-db:
    build:
      context: ./vector-db-service
      dockerfile: Dockerfile
    container_name: localllm-vector-db
    expose:
      - "8007"       # Internal only (service-to-service)
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - CHROMA_DB_PATH=/app/data/chromadb
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
    volumes:
      - vector_db_data:/app/data/chromadb
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2048M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  model-improvement:
    build:
      context: ./model-improvement-service
      dockerfile: Dockerfile
    container_name: localllm-model-improvement
    expose:
      - "8008"       # Internal only (service-to-service)
    depends_on:
      redis:
        condition: service_healthy
      model-manager:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - OLLAMA_URL=http://host.docker.internal:11434
      - META_ORCHESTRATOR_URL=http://meta-orchestrator:8004
      - MODEL_MANAGER_URL=http://model-manager:8005
      - COMMERCIAL_AI_API_KEY=${COMMERCIAL_AI_API_KEY:-${ANTHROPIC_API_KEY:-}}
    volumes:
      - ./comparison_results:/app/comparison_results
      - ./datasets/lora_profiles:/app/datasets/lora_profiles
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  redis_data:
  vector_db_data:
